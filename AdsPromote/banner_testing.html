<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GIF Banner</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  /* الحاوية الرئيسية للبنر - تملأ كامل مساحة الويب فيو (320x50 أو أي حجم يُعطى لها) */
  #banner-container {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #banner-container img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;   /* يملأ الحاوية بالكامل حتى لو الأبعاد الأصلية مختلفة */
    object-position: center;
    opacity: 0;
    transition: opacity 0.35s ease-in-out;
  }

  #banner-container img.active {
    opacity: 1;
  }
</style>
</head>
<body>

<div id="banner-container">
  <!-- سيتم حقن صور الـ GIF هنا تلقائياً عبر الجافاسكريبت -->
</div>

<script>
  // ضع هنا روابط الـ GIF الحقيقية التي تريد عرضها بالتناوب
  const gifList = [
    "https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif",
    "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif",
    "https://media.giphy.com/media/xT9IgG50Fb7Mi0prBC/giphy.gif",
    "https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif",
    "https://media.giphy.com/media/3orieWY9CS6zsBjhBK/giphy.gif"
  ];

  const container = document.getElementById('banner-container');
  let currentIndex = 0;
  let imgElements = [];

  // إنشاء عنصر <img> لكل GIF مسبقاً (لتفادي وميض التحميل عند التبديل)
  gifList.forEach((url, i) => {
    const img = document.createElement('img');
    img.src = url;
    img.alt = "banner-gif-" + i;
    if (i === 0) img.classList.add('active');
    container.appendChild(img);
    imgElements.push(img);
  });

  function showNextGif() {
    const currentImg = imgElements[currentIndex];
    currentIndex = (currentIndex + 1) % imgElements.length;
    const nextImg = imgElements[currentIndex];

    currentImg.classList.remove('active');
    nextImg.classList.add('active');
  }

  // التبديل كل 2 ثانية
  setInterval(showNextGif, 2000);
</script>

</body>
</html>
